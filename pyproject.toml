[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctaug"
version = "0.1.0"
description = "Cardiac CT-specific data augmentations simulating metal, wire, calcification, and step-and-shoot motion artifacts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Pooya Mohammadi Kazaj" },
]
keywords = ["cardiac ct", "data augmentation", "medical imaging", "pytorch", "deep learning", "MONAI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
    "scipy>=1.7",
    "scikit-image>=0.19",
]

[project.optional-dependencies]
monai = ["monai>=1.2"]
test = ["pytest>=7.0"]
# only needed to run example/example_notebook.ipynb (NIfTI/JSON I/O)
example = ["deep_utils>=1.5.19", "SimpleITK>=2.2"]

[project.urls]
Homepage = "https://github.com/AI-in-Cardiovascular-Medicine/CTAug"
Repository = "https://github.com/AI-in-Cardiovascular-Medicine/CTAug"
Issues = "https://github.com/AI-in-Cardiovascular-Medicine/CTAug/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ctaug"]

[tool.hatch.build.targets.sdist]
include = ["src/ctaug", "README.md", "LICENSE"]
